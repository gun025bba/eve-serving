name: ci
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: llmchat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GW_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/llmchat_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go run ./cmd/eve-policy verify
      - run: go test -race -count=1 ./...
      - name: Postgres integration tests must run (not skip)
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v -run 'TestAudit_|TestPostgres' ./internal/store/postgres | tee pg.out
          if grep -q -- '--- SKIP' pg.out; then echo "Postgres tests skipped"; exit 1; fi
          for t in TestAudit_PrivilegesAndAppendOnly TestAudit_ConcurrentChainAndTamper TestPostgresStore TestPostgresActions_ReissueRevise TestPostgresActions_ConcurrentReissueCap TestPostgresActions_ConcurrentReviseOnlyOneWins TestPostgresPush_CapOwnershipDelete TestPostgresProactiveMessagesUnread TestPostgresJobFK TestPostgresActions_ReviseOrderAndExpired TestPostgresActions_JobOwnership; do grep -q -- "--- PASS: $t" pg.out || { echo "$t did not run"; exit 1; }; done
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
