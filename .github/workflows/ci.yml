name: ci
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  deploy-nopasswd-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: passwordless-deploy tests on macOS (system bash 3.2, BSD tools, no sudo)
        run: |
          set -eux
          /bin/bash --version | head -1
          /bin/bash deploy/nopasswd/test/run.sh
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: llmchat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GW_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/llmchat_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: passwordless-deploy entrypoint tests (bash)
        run: bash deploy/nopasswd/test/run.sh
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go run ./cmd/eve-policy verify
      - run: go test -race -count=1 ./...
      - name: check-serve.sh fixtures
        run: sh scripts/check-serve_test.sh
      - name: Postgres integration tests must run (not skip)
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v -run 'TestAudit_|TestPostgres' ./internal/store/postgres | tee pg.out
          if grep -q -- '--- SKIP' pg.out; then echo "Postgres tests skipped"; exit 1; fi
          for t in TestAudit_PrivilegesAndAppendOnly TestAudit_ConcurrentChainAndTamper TestPostgresStore TestPostgresActions_ReissueRevise TestPostgresActions_ConcurrentReissueCap TestPostgresActions_ConcurrentReviseOnlyOneWins TestPostgresPush_CapOwnershipDelete TestPostgresProactiveMessagesUnread TestPostgresJobFK TestPostgresActions_ReviseOrderAndExpired TestPostgresActions_JobOwnership TestPostgresActions_PayloadHashSurvivesJSONB; do grep -q -- "--- PASS: $t" pg.out || { echo "$t did not run"; exit 1; }; done
      - name: e2e build tag (vet + tests)
        run: go vet -tags e2e ./... && go test -tags e2e -count=1 ./internal/auth/
      - name: Default binary has no e2e identity injection
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o gw-default ./cmd/gateway
          CGO_ENABLED=0 go build -tags e2e -o gw-e2e ./cmd/gateway
          # the check must be able to see the symbol in an e2e build ...
          go tool nm gw-e2e > nm-e2e.txt
          go tool nm gw-default > nm-default.txt
          grep -q 'auth.(\*e2eIdentity)' nm-e2e.txt || { echo "nm check is broken: e2e symbol not found in e2e build"; exit 1; }
          # ... and must not find it (or the header name) in the default build
          if grep -E 'e2eIdentity|HeaderE2EIdentity' nm-default.txt; then echo "e2e symbols in default binary"; exit 1; fi
          echo "default binary: $(wc -l < nm-default.txt) symbols, 0 e2e symbols; e2e binary: $(grep -c e2eIdentity nm-e2e.txt) e2e symbol(s)"
          if grep -a -q 'X-Eve-Test-Identity' gw-default; then echo "e2e header string in default binary"; exit 1; fi
          # the default binary refuses to start with the injection flag
          echo ci-key > k; chmod 600 k; set +e
          out=$(GW_LOG_FILE=$PWD/gw.log GW_TEST_IDENTITY_INJECTION=true ./gw-default -config /nonexistent.yaml -key-file k -port 18999 2>&1); rc=$?
          set -e
          echo "$out"
          [ $rc -ne 0 ] && grep -q 'without -tags e2e' <<<"$out"
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
