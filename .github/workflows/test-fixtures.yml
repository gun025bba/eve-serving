# Regenerates the REAL Sigstore-signed fixtures that deploy/nopasswd/test/run.sh verifies offline (never published, never accepted by the Mac).
# Run it from a throwaway branch fixture/** (push) or by hand; download the artifacts and commit them under deploy/nopasswd/test/fixtures/.
name: test-fixtures
on:
  push:
    branches: ["fixture/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    permissions: {contents: write, id-token: write}
    uses: ./.github/workflows/deploy-sign.yml
    with: {kind: gateway, fixture: true, fixture-version: "9.1.0"}
  web:
    permissions: {contents: write, id-token: write}
    uses: ./.github/workflows/deploy-sign.yml
    with: {kind: web, fixture: true, fixture-version: "9.1.0", web-dir: deploy/nopasswd/test/web-fixture, web-exclude: '^$'}
