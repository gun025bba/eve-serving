# Reusable release + signing workflow. THIS FILE IS THE TRUST ROOT of the passwordless deploy: the Mac's entrypoint accepts a release only
# if its Sigstore certificate says it was produced by `.../.github/workflows/deploy-sign.yml@refs/heads/main`, called by a push of the
# tag vX.Y.Z in the pinned repository. Callers must reference it as  gun025bba/eve-serving/.github/workflows/deploy-sign.yml@main
# (NOT ./.github/...: a local call from the tagged commit would run the tag's own copy and get a different, rejected, identity).
# Keep main protected (see docs/deploy-signing.md); changing this file changes who can ship to the Mac.
name: deploy-sign
on:
  workflow_call:
    inputs:
      kind:
        description: gateway | web
        type: string
        required: true
      web-dir:
        description: web kind - directory with the UI tree (tracked files are packed)
        type: string
        default: "."
      web-exclude:
        description: web kind - ERE of tracked paths NOT shipped
        type: string
        default: '^(\.github/|tests/|review-shots/|README\.md$|\.gitignore$|\.gitattributes$)'
      migrations-dir:
        description: gateway kind - goose migrations; the highest NNNNN_ number is the schema version in the manifest
        type: string
        default: internal/store/postgres/migrations
      fixture:
        description: TEST ONLY - sign a stub bundle from a non-tag ref (never accepted by the Mac); nothing is published
        type: boolean
        default: false
      fixture-version:
        type: string
        default: "9.1.0"
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    environment: deploy          # optional protection point: add required reviewers / a tag policy under Settings > Environments
    permissions:
      contents: write            # create the GitHub release (not used for fixtures)
      id-token: write            # the keyless signing identity (OIDC) - the ONLY credential in this job
    env:
      KIND: ${{ inputs.kind }}
      FIXTURE: ${{ inputs.fixture }}
      FIXTURE_VERSION: ${{ inputs.fixture-version }}
      WEB_DIR: ${{ inputs.web-dir }}
      WEB_EXCLUDE: ${{ inputs.web-exclude }}
      MIGRATIONS_DIR: ${{ inputs.migrations-dir }}
      REPO: ${{ github.repository }}
      REF: ${{ github.ref }}
      SHA: ${{ github.sha }}
      EVENT: ${{ github.event_name }}
      TOOLS: ${{ inputs.fixture && '.' || '.eve-tools' }}
      COSIGN_VERSION: v3.1.4
      COSIGN_LINUX_AMD64_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        if: ${{ !inputs.fixture }}
        with:
          repository: gun025bba/eve-serving     # the packing script always comes from main of the signing repo, never from the tagged commit
          ref: main
          path: .eve-tools
          persist-credentials: false
      - name: Resolve version and check that the tagged commit is on main or release/X.Y.Z
        id: v
        run: |
          set -euo pipefail
          case "$KIND" in gateway|web) ;; *) echo "bad kind"; exit 1;; esac
          if [ "$FIXTURE" = true ]; then
            VER=$FIXTURE_VERSION; BRANCH=main
          else
            [ "$EVENT" = push ] || { echo "releases are built from a tag push only (got $EVENT)"; exit 1; }
            [[ "$REF" =~ ^refs/tags/v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] || { echo "ref is not refs/tags/vX.Y.Z: $REF"; exit 1; }
            VER=${REF#refs/tags/v}
            [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "checked-out commit != $SHA"; exit 1; }
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' || true
            git fetch --no-tags origin "+refs/heads/release/$VER:refs/remotes/origin/release/$VER" 2>/dev/null || true
            BRANCH=""
            if git merge-base --is-ancestor "$SHA" refs/remotes/origin/main 2>/dev/null; then BRANCH=main
            elif git merge-base --is-ancestor "$SHA" "refs/remotes/origin/release/$VER" 2>/dev/null; then BRANCH="release/$VER"; fi
            [ -n "$BRANCH" ] || { echo "commit $SHA is not on main or release/$VER: refusing to sign"; exit 1; }
          fi
          echo "version=$VER" >>"$GITHUB_OUTPUT"; echo "branch=$BRANCH" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff   # v5
        if: inputs.kind == 'gateway' && !inputs.fixture
        with:
          go-version-file: go.mod
      - name: Install cosign (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/cosign" "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_LINUX_AMD64_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"
      - name: Build (gateway)
        if: inputs.kind == 'gateway'
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          if [ "$FIXTURE" = true ]; then
            cp "$TOOLS/deploy/nopasswd/test/fixture-src/gateway" "$RUNNER_TEMP/bin/gateway"; cp "$TOOLS/deploy/nopasswd/test/fixture-src/eve-gw" "$RUNNER_TEMP/bin/eve-gw"
          else
            export GOOS=darwin GOARCH=arm64 CGO_ENABLED=0
            go build -trimpath -ldflags "-s -w -X main.version=$VER" -o "$RUNNER_TEMP/bin/gateway" ./cmd/gateway
            go build -trimpath -ldflags "-s -w -X main.version=$VER" -o "$RUNNER_TEMP/bin/eve-gw" ./cmd/eve-gw
          fi
          ls -l "$RUNNER_TEMP/bin"
      - name: Pack + manifest
        env:
          VER: ${{ steps.v.outputs.version }}
          BRANCH: ${{ steps.v.outputs.branch }}
        run: |
          set -euo pipefail
          extra=()
          [ "$FIXTURE" != true ] || extra+=(--fixture)
          if [ "$KIND" = gateway ]; then
            SCHEMA=$(ls "$MIGRATIONS_DIR" | sed -nE 's/^0*([0-9]+)_.*\.sql$/\1/p' | sort -n | tail -1)
            [ -n "$SCHEMA" ] || { echo "no migrations found in $MIGRATIONS_DIR"; exit 1; }
            bash "$TOOLS/deploy/nopasswd/make-release.sh" --kind gateway --version "$VER" --git-sha "$SHA" --repo "$REPO" --ref "$REF" --branch "$BRANCH" \
              --schema "$SCHEMA" --gateway "$RUNNER_TEMP/bin/gateway" --eve-gw "$RUNNER_TEMP/bin/eve-gw" --out "$RUNNER_TEMP/out" "${extra[@]}"
          else
            bash "$TOOLS/deploy/nopasswd/make-release.sh" --kind web --version "$VER" --git-sha "$SHA" --repo "$REPO" --ref "$REF" --branch "$BRANCH" \
              --web-dir "$WEB_DIR" --web-exclude "$WEB_EXCLUDE" --out "$RUNNER_TEMP/out" "${extra[@]}"
          fi
      - name: Sign the manifest (Sigstore keyless; the bundle carries the certificate and the transparency-log proof)
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/cosign" sign-blob --yes --bundle "eve-$KIND-$VER.sigstore.json" "eve-$KIND-$VER.MANIFEST"
          "$RUNNER_TEMP/cosign" verify-blob --bundle "eve-$KIND-$VER.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/gun025bba/eve-serving/\.github/workflows/deploy-sign\.yml@refs/' \
            --certificate-github-workflow-repository "$REPO" --certificate-github-workflow-ref "$REF" --certificate-github-workflow-sha "$SHA" \
            "eve-$KIND-$VER.MANIFEST"
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: eve-release-${{ inputs.kind }}-${{ steps.v.outputs.version }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish the GitHub release
        if: ${{ !inputs.fixture }}
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          gh release create "v$VER" --repo "$REPO" --verify-tag --title "$KIND v$VER" \
            --notes "Signed by CI (Sigstore keyless). Verified on the Mac by /usr/local/libexec/eve/deploy; commit $SHA." \
            "eve-$KIND-$VER.MANIFEST" "eve-$KIND-$VER.sigstore.json" "eve-$KIND-$VER.tar"
