# Gateway config. Env vars override (e.g. GW_MAX_CONC=3, GW_LOG_LEVEL=DEBUG).
upstream: http://127.0.0.1:8080
model: mlx-community/Qwen3-30B-A3B-4bit
defaults:            # applied only when the client omits the field
  max_tokens: 8192   # Qwen3 thinking often needs 4-8k tokens; 1024 truncated inside <think>
  temperature: 0.7
  top_p: 0.9
max_conc: 2          # concurrent requests to the model (per gateway process)
max_tokens_cap: 16384 # client max_tokens/max_completion_tokens above this are clamped (0 = no cap)
max_queue: 16        # waiting requests before 429 queue_full
queue_timeout_s: 120 # max wait in queue before 429 queue_timeout
connect_timeout_s: 5
read_timeout_s: 300  # max gap between bytes from upstream -> 504 upstream_timeout
retries: 2           # connection-error retries (never once generation has started)
retry_backoff_s: 0.5
log_level: INFO
log_file: ~/llm-serving/gateway.log
stats_window: 200    # recent requests used by /stats
min_free_mem_gb: 4   # /ready fails below this available memory
cors_origins: []     # e.g. ["http://localhost:5173"]; empty = CORS off
static_dir: ~/llm-serving/web   # served at /ui only if the directory exists
# Browser identity (4.0.0): logins (users.login, e.g. "user@github") that may
# pair a browser with `eve-gw pair --user <login>` and keep a session. Empty =
# no browser sessions (API key only). Tailscale-User-* headers are never used
# for identity. Prefer GW_ALLOWED_USERS (comma separated) so real logins are
# not committed.
allowed_users: []
# Extra Host header values accepted besides localhost/127.0.0.1/::1, normally
# the tailnet serve name. Prefer GW_ALLOWED_HOSTS so the name is not committed.
allowed_hosts: []
# HMAC pepper for pairing codes and session tokens; must be mode 0600.
# Default <base>/.session_pepper (GW_SESSION_PEPPER_FILE).
# session_pepper_file: /opt/eve-gw/etc/session_pepper
auth:
  # Auth providers, tried in order; first success wins. Env: GW_AUTH_PROVIDERS=a,b
  providers: [session, api-key]
# Conversation storage (PostgreSQL). Empty url = disabled: chat works, thread
# endpoints return 503 persistence_disabled. Never commit the url; set
# GW_DATABASE_URL (deploy/install-launchd-go.sh reads it from .db_env).
database:
  url: ""
  auto_migrate: true   # run embedded goose migrations at startup (GW_DB_AUTO_MIGRATE)
web:                 # web_search / web_fetch tools (docs/web-search.md). On by default since 6.0.0.
  enabled: true      # GW_WEB_ENABLED (master switch; false removes the web tools)
  # 6.0.0: when enabled the model decides per request whether to search (auto tool selection). There is no
  # per-request or per-user switch; the request field "web_search" is ignored.
  auto_select_off: false  # GW_WEB_AUTO_SELECT_OFF: rollback, turns auto selection off for everyone (fails closed:
                          # an unparsable env value also turns it off; the env can never turn it back on over the file)
  default_mode: auto      # deprecated (GW_WEB_DEFAULT_MODE): auto = no-op, off = auto_select_off, "force" refuses to load (removed in 6.0.0)
  user_daily_search: 150  # per user per day (Asia/Seoul); GW_WEB_USER_DAILY_SEARCH
  user_daily_fetch: 100   # GW_WEB_USER_DAILY_FETCH
  global_search_per_min: 30    # all users; GW_WEB_GLOBAL_SEARCH_PER_MIN
  global_fetch_per_min: 60     # GW_WEB_GLOBAL_FETCH_PER_MIN
  global_daily_search: 1500    # all users per day (Asia/Seoul); GW_WEB_GLOBAL_DAILY_SEARCH
  global_daily_fetch: 800      # GW_WEB_GLOBAL_DAILY_FETCH
  max_rounds: 3
  max_calls: 5
  max_searches: 2         # web_search calls per turn (G2); values above 2 are capped at 2
  rate_per_min: 10        # searches per user per minute
  fetch_rate_per_min: 20  # fetches per user per minute
  retention_days: 90      # tool_calls / web_sources auto-deleted after this
  args_retention_days: 90 # tool_calls.args (query/URL) cleared to {} after this; values below 90 are refused
  providers: [searxng]    # GW_SEARCH_PROVIDERS; "brave" is a stub (disabled)
  searxng_url: http://127.0.0.1:8888   # loopback only (enforced)
  search_timeout_s: 6
  search_max_results: 5
  fetch_timeout_s: 10
  fetch_max_bytes: 2097152
  fetch_max_chars: 6000
  fetch_max_pages: 3
  fetch_allowed_ports: [80, 443]       # 5432/6379/8000/8080/8888 are always denied
  fetch_deny_cidrs: []
  fetch_global_conc: 4
  fetch_per_host_conc: 2

tools:                    # 6.0.0 automatic tool selection (docs/architecture/auto-tool-selection.md)
  # log_hmac_key_file: ~/llm-serving/etc/tools_log_hmac.key   # GW_TOOLS_LOG_HMAC_KEY_FILE
  #   0600 file, 64+ hex characters. REQUIRED for automatic selection: without a usable key the web tools are off.
  v4_mode: off            # GW_TOOLS_V4_MODE: off | shadow | on (same-model yes/no decision call, design 4.4.1)
  # pim_window_start: "2026-11-01T09:00:00+09:00"   # GW_TOOLS_PIM_WINDOW_START (RFC 3339)
  #   When 5.1.0 went live. 5.1.0 does not record personal-data (calendar/reminder) reads, so assistant messages
  #   created from then on WITHOUT metadata.tools[] are treated as personal-data reads (design 4.3.4 M-f):
  #   a request whose history holds one makes no web search. Unset = "earliest" (the whole history; fail closed).
  # pim_window_end: "2026-11-15T09:00:00+09:00"     # GW_TOOLS_PIM_WINDOW_END (RFC 3339)
  #   When 6.0.0 went live (it writes metadata.tools[] on every assistant message). Unset = no end; that is safe.
  #   The metric llm_pim_window_assumed_total counts the requests this rule affected.
