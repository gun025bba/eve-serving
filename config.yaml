# Gateway config. Env vars override (e.g. GW_MAX_CONC=3, GW_LOG_LEVEL=DEBUG).
upstream: http://127.0.0.1:8080
model: mlx-community/Qwen3-30B-A3B-4bit
defaults:            # applied only when the client omits the field
  max_tokens: 8192   # Qwen3 thinking often needs 4-8k tokens; 1024 truncated inside <think>
  temperature: 0.7
  top_p: 0.9
max_conc: 2          # concurrent requests to the model (per gateway process)
max_tokens_cap: 16384 # client max_tokens/max_completion_tokens above this are clamped (0 = no cap)
max_queue: 16        # waiting requests before 429 queue_full
queue_timeout_s: 120 # max wait in queue before 429 queue_timeout
connect_timeout_s: 5
read_timeout_s: 300  # max gap between bytes from upstream -> 504 upstream_timeout
retries: 2           # connection-error retries (never once generation has started)
retry_backoff_s: 0.5
log_level: INFO
log_file: ~/llm-serving/gateway.log
stats_window: 200    # recent requests used by /stats
min_free_mem_gb: 4   # /ready fails below this available memory
cors_origins: []     # e.g. ["http://localhost:5173"]; empty = CORS off
static_dir: ~/llm-serving/web   # served at /ui only if the directory exists
# Browser identity (4.0.0): logins (users.login, e.g. "user@github") that may
# pair a browser with `eve-gw pair --user <login>` and keep a session. Empty =
# no browser sessions (API key only). Tailscale-User-* headers are never used
# for identity. Prefer GW_ALLOWED_USERS (comma separated) so real logins are
# not committed. A login is ASCII only: letters, digits and . _ @ + - (at most
# 254 bytes, compared case-insensitively); anything else (spaces, commas, non-ASCII
# look-alikes) makes the gateway refuse to start. An empty list refuses every browser
# session and logs a startup warning, but API keys still authenticate (they do not use
# this list). GW_ALLOWED_USERS set but empty is treated as unset: it does not replace
# this list (a warning is logged).
allowed_users: []
# Extra Host header values accepted besides localhost/127.0.0.1/::1, normally
# the tailnet serve name. Prefer GW_ALLOWED_HOSTS so the name is not committed.
allowed_hosts: []
# HMAC pepper for pairing codes and session tokens; must be mode 0600.
# Default <base>/.session_pepper (GW_SESSION_PEPPER_FILE).
# session_pepper_file: /opt/eve-gw/etc/session_pepper
auth:
  # Auth providers, tried in order; first success wins. Env: GW_AUTH_PROVIDERS=a,b
  providers: [session, api-key]
# Conversation storage (PostgreSQL). Empty url = disabled: chat works, thread
# endpoints return 503 persistence_disabled. Never commit the url; set
# GW_DATABASE_URL (deploy/install-launchd-go.sh reads it from .db_env).
database:
  url: ""
  auto_migrate: true   # run embedded goose migrations at startup (GW_DB_AUTO_MIGRATE)
web:                 # web_search / web_fetch tools (docs/web-search.md). Off by default.
  enabled: false     # GW_WEB_ENABLED
  default_mode: off  # off|auto|force (GW_WEB_DEFAULT_MODE); per request: "web_search"
  max_rounds: 3
  max_calls: 5
  max_searches: 3
  rate_per_min: 10        # searches per user per minute
  fetch_rate_per_min: 20  # fetches per user per minute
  retention_days: 90      # tool_calls / web_sources auto-deleted after this
  providers: [searxng]    # GW_SEARCH_PROVIDERS; "brave" is a stub (disabled)
  searxng_url: http://127.0.0.1:8888   # loopback only (enforced)
  search_timeout_s: 6
  search_max_results: 5
  fetch_timeout_s: 10
  fetch_max_bytes: 2097152
  fetch_max_chars: 6000
  fetch_max_pages: 3
  fetch_allowed_ports: [80, 443]       # 5432/6379/8000/8080/8888 are always denied
  fetch_deny_cidrs: []
  fetch_global_conc: 4
  fetch_per_host_conc: 2
