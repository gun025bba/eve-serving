name: reminders_add
version: 1.0.0
description: "Propose adding one reminder (title, optional due as RFC 3339 with offset, optional list name). Nothing is written until the user approves the confirmation card; you only get status pending_confirmation back. The reminder syncs to the user's linked accounts once approved."
scopes: [reminders.write]
side_effect: write
verbs: [add]
taint_output: false
egress: []
secrets: []
timeout: 5s
max_result_chars: 1000
exposure: {modes: [auto], max_per_turn: 2}
