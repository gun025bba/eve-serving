<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="600" viewBox="0 0 1360 600"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="42.0" font-size="22" fill="#1e1e1e" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif">선톡(proactive messaging) 설계 — 전부 계획</text><rect x="40" y="80" width="260" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="170.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">트리거</text><text x="170.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">schedule(아침 브리핑) · event(툴 watch)</text><text x="170.0" y="149.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">follow-up(모델 예약 → 사용자 확인)</text><rect x="380" y="80" width="260" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="510.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">scheduler (gateway 내 goroutine)</text><text x="510.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">scheduled_jobs 폴링 · advisory lock</text><text x="510.0" y="149.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">단일 리더 · Asia/Seoul</text><rect x="720" y="80" width="260" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="850.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">툴 플랫폼 파이프라인 (PR #2)</text><text x="850.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">read 툴만 자동 · taint 검사</text><text x="850.0" y="149.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">write/send → confirm gate</text><rect x="1060" y="80" width="260" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="1190.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">모델 실행</text><text x="1190.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">mlx_lm.server 127.0.0.1:8080</text><text x="1190.0" y="149.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">결과 = assistant 메시지 (origin)</text><rect x="1060" y="250" width="260" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="1190.0" y="279.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">anti-spam 게이트</text><text x="1190.0" y="303.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">quiet hours · rate cap · dedupe</text><text x="1190.0" y="319.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">트리거별/전역 off</text><rect x="720" y="250" width="260" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="850.0" y="279.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">PostgreSQL</text><text x="850.0" y="303.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">messages(origin) · notifications</text><text x="850.0" y="319.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">push_subscriptions · scheduled_jobs</text><rect x="380" y="250" width="260" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="510.0" y="279.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">Web Push 발송 (outbound)</text><text x="510.0" y="303.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">VAPID · aes128gcm</text><text x="510.0" y="319.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">내용 없는 최소 payload</text><rect x="40" y="250" width="260" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="170.0" y="279.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">Apple Push Service</text><text x="170.0" y="303.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">*.push.apple.com</text><rect x="40" y="420" width="260" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="170.0" y="449.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">iPhone PWA (홈 화면)</text><text x="170.0" y="473.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">알림 탭 → tailnet으로 앱 열기</text><text x="170.0" y="489.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">→ /v1/notifications 조회</text><rect x="380" y="420" width="260" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="510.0" y="449.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">in-app 알림</text><text x="510.0" y="473.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">UI 배지 · 스레드 목록 갱신</text><line x1="300" y1="135.0" x2="380" y2="135.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="640" y1="135.0" x2="720" y2="1