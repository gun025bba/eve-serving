<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="600" viewBox="0 0 1140 600"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="42.0" font-size="22" fill="#1e1e1e" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif">선톡(proactive messaging) 설계 — 전부 계획 (단순화 후)</text><rect x="40" y="80" width="300" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="190.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">job</text><text x="190.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">when: rrule | at · template_id</text><text x="190.0" y="149.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">send_if_changed (templates/&lt;id&gt;.yaml)</text><rect x="420" y="80" width="300" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="570.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">scheduler (gateway 내, 기존 queue)</text><text x="570.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">시작부터 tainted · write 스코프 거부</text><text x="570.0" y="149.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">lock 단일 리더 · 스팸 방지(tx 내 cap)</text><rect x="800" y="80" width="300" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="950.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">툴 파이프라인 + 모델 (PR #2)</text><text x="950.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">read 툴만 · write/send → 제안(토큰 없음)</text><text x="950.0" y="149.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">mlx_lm.server 127.0.0.1:8080</text><rect x="800" y="250" width="300" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="950.0" y="279.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">PostgreSQL</text><text x="950.0" y="303.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">scheduled_jobs · push_subscriptions</text><text x="950.0" y="319.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">messages(+컬럼) · tool_audit</text><rect x="420" y="250" width="300" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="570.0" y="279.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">Deliverer: webpush</text><text x="570.0" y="303.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">egress 단일 계층 · VAPID</text><text x="570.0" y="319.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">{v,type,nid} 고정 payload</text><rect x="40" y="250" width="300" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="190.0" y="279.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">Apple Push Service</text><text x="190.0" y="303.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">web.push.apple.com (정확 일치)</text><text x="190.0" y="319.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">확인 전 비활성</text><rect x="420" y="420" width="300" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="8 5"/><text x="570.0" y="449.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">iPhone PWA / in-app</text><text x="570.0" y="473.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">알림 탭 → tailnet으로 앱 열기</text><text x="570.0" y="489.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">읽지 않은 proactive 메시지 = in-app 알림</text><line x1="340" y1="135.0" x2="420" y2="135.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="720" y1="135.0" x2="800" y2="135.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="950.0" y1="190" x2="950.0" y2="250" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="800" y1="305.0" x2="720" y2="305.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="420" y1="305.0" x2="340" y2="305.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><text x="380.0" y="297.0" font-size="12" fill="#868e96" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">outbound</text><line x1="190.0" y1="360" x2="420" y2="475.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="950.0" y1="360" x2="720" y2="475.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><text x="835.0" y="409.5" font-size="12" fill="#868e96" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">in-app</text><text x="40" y="573.0" font-size="13" fill="#868e96" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif">실선 파랑 = 현재 저장소에 존재 · 점선 보라 = 계획/미병합 PR</text></svg>