<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1160" viewBox="0 0 2200 1160"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker></defs><text x="1100.0" y="50.0" font-size="34" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">Eve 툴 선택 강제 수단 — 안전 = A(+D) · 재현율 = V4(PM 결정) · B 보류 (rev 2)</text><text x="1100.0" y="82.0" font-size="18" fill="#555" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">실선 = 채택(핵심 박스) · 보라 점선 = 부속 기능/보류(트리거 충족 시) · 주황 점선 박스 C = PM 결정 대기 · 주황 실선 = 프롬프트에만 남는 것(보장 아님)</text><rect x="40" y="110" width="420" height="720" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2" stroke-dasharray="10 6"/><text x="56" y="142.0" font-size="22" fill="#e03131" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">① 모델 쪽 (신뢰하지 않음)</text><rect x="60" y="165" width="380" height="200" rx="14" fill="#fff" stroke="#e03131" stroke-width="2"/><text x="250.0" y="196.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">mlx_lm.server 출력</text><text x="74" y="222.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">Qwen3 tool_call / 텍스트</text><text x="74" y="242.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">tool_choice는 무시될 수 있음(F17)</text><text x="74" y="262.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">무엇을 부를지는 모델이 정한다</text><text x="74" y="282.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">= 입력이 아니라 &quot;요청&quot;으로 취급</text><rect x="60" y="395" width="380" height="200" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text x="250.0" y="426.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">시스템 프롬프트 (보장 아님)</text><text x="74" y="452.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">날짜 · 검색 규칙 · Gate 힌트</text><text x="74" y="472.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">&quot;쿼리는 사용자 메시지에서만&quot;</text><text x="74" y="492.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">→ 검색할지 말지(재현율·과호출)는</text><text x="74" y="512.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">   프롬프트와 평가(§8)로만 다룬다</text><rect x="60" y="625" width="380" height="185" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2" stroke-dasharray="10 6"/><text x="250.0" y="656.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">B. 출력 형식 강제 (보류)</text><text x="74" y="682.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">로짓 프로세서·JSON 스키마 문법</text><text x="74" y="702.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">tool_choice 무시 확인(실측) · 파싱 폴백 0건</text><text x="74" y="722.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">response_format 무시(외부 보고)</text><text x="74" y="742.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">트리거: 파싱 폴백·실패율 &gt; 기준</text><rect x="500" y="110" width="1000" height="720" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2" stroke-dasharray="10 6"/><text x="516" y="142.0" font-size="22" fill="#e8590c" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">② Go gateway — A. 정책 검사 (채택, 이미 설계된 사전 점검 하나)</text><rect x="525" y="165" width="950" height="130" rx="14" fill="#fff" stroke="#e8590c" stroke-width="2"/><text x="1000.0" y="196.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">라운드 시작: Expose(상태) → 툴 정의 (순수 함수)</text><text x="539" y="222.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">상태 = {개인 데이터 읽음, 툴 결과 있음, fetch 읽음, suspect, 킬스위치, scope}</text><text x="539" y="242.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">G1 개인 데이터 읽은 턴 검색 0 · G2 툴 결과 있는 라운드에 검색 없음 · G3 fetch 뒤 검색·fetch 없음</text><text x="539" y="262.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">모델은 Expose가 준 정의만 본다 → 이름을 불러도 사전 점검에서 denied</text><rect x="525" y="325" width="950" height="300" rx="14" fill="#fff" stroke="#e8590c" stroke-width="2"/><text x="1000.0" y="356.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">tool_call 사전 점검 (실행 전, 한 번, 위에서 아래로)</text><text x="539" y="383.4" font-size="17" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">킬스위치(G4) → registry → Expose 재확인 → schema → 정규화(M-5)</text><text x="539" y="404.65" font-size="17" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">→ 쿼리 검사기 D: CheckQuery(시크릿 패턴·128룬, G2)</text><text x="539" y="425.9" font-size="17" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">→ Echo 4-gram(G5) → [부속] 사용자 메시지 출처 겹침(그림자 지표, 게이트 아님)</text><text x="539" y="447.15" font-size="17" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">→ URL 규칙(G1·G3: 사용자가 쓴 URL·이번 턴 sources만) → Budget(턴·분·일·전역)</text><text x="539" y="468.4" font-size="17" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">실패 = tool_result denied/error + error_code, 인자는 저장·전송 안 함</text><text x="539" y="489.65" font-size="17" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">통과 = SSE tool_call → Platform.exec → Suspect → untrusted 래핑</text><rect x="525" y="655" width="950" height="150" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><text x="1000.0" y="686.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">결정적 보장의 경계</text><text x="539" y="712.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">보장: 어떤 툴이 보이는가 · 몇 번 · 어떤 URL·쿼리 형태 · 쓰기는 카드 · 킬스위치 즉시</text><text x="539" y="732.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">보장 못함: 검색할지 말지 · 의역·번역된 쿼리의 의미 · 사용자 메시지 자체의 민감 내용(잔여 위험 ①②)</text><line x1="440" y1="265" x2="525" y2="390" stroke="#e03131" stroke-width="3" marker-end="url(#a)"/><line x1="440" y1="720" x2="525" y2="560" stroke="#6741d9" stroke-width="3" marker-end="url(#a)" stroke-dasharray="10 6"/><rect x="1540" y="110" width="620" height="720" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="2" stroke-dasharray="10 6"/><text x="1556" y="142.0" font-size="22" fill="#495057" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">③ 하위 서비스 · 보류한 후보</text><rect x="1560" y="165" width="580" height="150" rx="14" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="1850.0" y="196.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">web_search / web_fetch / 캘린더</text><text x="1574" y="222.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">SearXNG → 외부 검색엔진 (쿼리만 나감)</text><text x="1574" y="242.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">캘린더 쓰기 = 확인 카드</text><rect x="1560" y="345" width="580" height="230" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2" stroke-dasharray="10 6"/><text x="1850.0" y="376.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">C. V4 게이트 (PM 결정 대기)</text><text x="1574" y="402.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">같은 모델 한 단어 분류 → gateway가 호출 강제</text><text x="1574" y="422.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">재현율 100%(프롬프트 최고 80.9%)</text><text x="1574" y="442.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">불필요 검색 6.5%(상한 15.4% &gt; 8%) · p95 1.85초</text><text x="1574" y="462.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">&quot;별도 분류기 없음&quot; 원칙과 충돌 → 개정 5</text><text x="1574" y="482.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">A 아래에서만: G1~G3·킬스위치 우선, 음성이면 툴 유지</text><rect x="1560" y="605" width="580" height="205" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2" stroke-dasharray="10 6"/><text x="1850.0" y="636.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">부속: 사용자 메시지 출처 검사 (D 확장)</text><text x="1574" y="662.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">쿼리의 새 어휘가 사용자 메시지에 없는</text><text x="1574" y="682.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">비율을 센다. 처음엔 그림자 지표(해시·개수만)</text><text x="1574" y="702.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">오탐(한→영 번역 쿼리) 측정 뒤 게이트 여부 결정</text><text x="1574" y="722.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">잔여 위험 ②를 줄이는 유일한 결정적 후보</text><line x1="1475" y1="480" x2="1560" y2="240" stroke="#e8590c" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="860" width="2120" height="270" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="2" stroke-dasharray="10 6"/><text x="56" y="892.0" font-size="22" fill="#495057" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">④ 확장 청사진 (트리거 → 다음 단계, 박스는 그때 추가)</text><rect x="60" y="915" width="500" height="190" rx="14" fill="#fff" stroke="#6741d9" stroke-width="2" stroke-dasharray="10 6"/><text x="310.0" y="946.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">트리거 1: 파싱 실패율 (실측 0건)</text><text x="74" y="972.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">§7 지표가 기준 초과</text><text x="74" y="992.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">→ 먼저 프롬프트·재시도 1회</text><text x="74" y="1012.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">→ 그래도면 B의 tool_call 문법 한정</text><text x="74" y="1032.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">(서버 밖 래퍼, 배칭 비활성)</text><rect x="590" y="915" width="500" height="190" rx="14" fill="#fff" stroke="#6741d9" stroke-width="2" stroke-dasharray="10 6"/><text x="840.0" y="946.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">트리거 2: 재현율 부족 (충족됨)</text><text x="604" y="972.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">프롬프트 최고 80.9% &lt; 90%</text><text x="604" y="992.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">→ V4 채택 여부 PM 결정(개정 5)</text><text x="604" y="1012.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">→ 미채택이면 기준 조정 또는 분리</text><text x="604" y="1032.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">   (사후 점검 재요청은 대안)</text><rect x="1120" y="915" width="500" height="190" rx="14" fill="#fff" stroke="#6741d9" stroke-width="2" stroke-dasharray="10 6"/><text x="1370.0" y="946.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">트리거 3: 의역 유출 관측</text><text x="1134" y="972.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">그림자 지표나 카나리에서 송출 확인</text><text x="1134" y="992.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">→ 출처 검사 게이트화</text><text x="1134" y="1012.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">→ 필요하면 C의 쿼리 재작성 격리</text><text x="1134" y="1032.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">(사용자 메시지만 보는 호출)</text><rect x="1650" y="915" width="490" height="190" rx="14" fill="#fff" stroke="#6741d9" stroke-width="2" stroke-dasharray="10 6"/><text x="1895.0" y="946.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" xml:space="preserve">트리거 4: 툴 증가 (메일 등)</text><text x="1664" y="972.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">manifest + Expose 규칙만 추가</text><text x="1664" y="992.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">툴이 많아지면 그룹 단위 Expose</text><text x="1664" y="1012.4" font-size="16" fill="#333" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif" font-weight="400" xml:space="preserve">라우터는 그때 후보 선별로 재평가</text></svg>