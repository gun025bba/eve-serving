<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="430" viewBox="0 0 1360 430"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="42.0" font-size="22" fill="#1e1e1e" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif">네트워크 · Tailscale</text><rect x="40" y="80" width="260" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="170.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">tailnet 기기</text><text x="170.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">tailnet 전용 (Funnel OFF)</text><rect x="380" y="80" width="260" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="510.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">tailscale serve</text><text x="510.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">HTTPS :443 → 127.0.0.1:8000</text><text x="510.0" y="149.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">Tailscale-User-Login 헤더</text><rect x="720" y="80" width="260" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="850.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">gateway 127.0.0.1:8000</text><text x="850.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">loopback peer일 때만 헤더 신뢰</text><text x="850.0" y="149.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">allowed_users</text><rect x="380" y="250" width="260" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="510.0" y="279.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">gateway-ts (레거시)</text><text x="510.0" y="303.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">&lt;tailscale-ip&gt;:8000 리스너</text><text x="510.0" y="319.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">serve 전환 시 중지</text><rect x="1060" y="80" width="260" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text x="1190.0" y="109.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">내부 서비스</text><text x="1190.0" y="133.0" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">mlx 8080 · SearXNG 8888</text><text x="1190.0" y="149.25" font-size="13" fill="#495057" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">PostgreSQL — loopback</text><line x1="300" y1="135.0" x2="380" y2="135.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="640" y1="135.0" x2="720" y2="135.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="980" y1="135.0" x2="1060" y2="135.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="170.0" y1="190" x2="380" y2="305.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><text x="275.0" y="239.5" font-size="12" fill="#868e96" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif">구 방식</text><text x="40" y="403.0" font-size="13" fill="#868e96" text-anchor="start" font-family="Noto Sans CJK KR, sans-serif">실선 파랑 = 현재 저장소에 존재 · 점선 보라 = 계획/미병합 PR</text></svg>