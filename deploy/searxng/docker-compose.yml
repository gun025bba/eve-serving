# SearXNG for the gateway's web_search tool. Prepared, not auto-deployed.
# See install-colima.sh (runbook + rollback) and docs/web-search.md §2.8/§3.5.
# - images pinned by digest (update deliberately; see README in this dir)
# - only SearXNG is published, and only on 127.0.0.1 (never 0.0.0.0 / tailnet)
# - Valkey is not published; reachable only on the internal network
# - read-only root fs, all capabilities dropped, no-new-privileges
# - SEARXNG_SECRET comes from the environment (.env is git-ignored), never committed
name: searxng
services:
  valkey:
    image: docker.io/valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    # Password from .env (VALKEY_PASSWORD, openssl rand -hex 32); protected-mode stays on.
    # Valkey sits only on the internal (no-egress) network and is never published.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--protected-mode", "yes", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD in deploy/searxng/.env}"]
    restart: unless-stopped
    networks: [valkey]
    # Run as the image's valkey user so the entrypoint skips its chown (fails with cap_drop ALL).
    user: "999:1000"
    read_only: true
    tmpfs: ["/data:size=64m,uid=999,gid=1000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    logging: {driver: json-file, options: {max-size: "1m", max-file: "1"}}

  searxng:
    image: docker.io/searxng/searxng:2026.10.24-ef0ec03da@sha256:7c7cbe509429e82755104b2a95f52085a98633c95d53f44e4e905fa3a59f08c8
    restart: unless-stopped
    depends_on: [valkey]
    networks: [searxng, valkey]
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8888/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET in deploy/searxng/.env (openssl rand -hex 32)}"
      SEARXNG_VALKEY_URL: "valkey://:${VALKEY_PASSWORD}@valkey:6379/0"
      # Granian access log off (also the upstream default): queries must not reach container logs.
      GRANIAN_LOG_ACCESS_ENABLED: "false"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
    read_only: true
    tmpfs: ["/tmp:size=64m", "/var/cache/searxng:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
    # Access log off via GRANIAN_LOG_ACCESS_ENABLED=false; verify after install with
    # `docker logs searxng-searxng-1 | grep -c <test query>` == 0 (§2.7, review item 7).
    logging: {driver: json-file, options: {max-size: "1m", max-file: "1"}}

networks:
  searxng:             # egress for upstream search engines
    ipam:
      config:
        - subnet: 172.18.0.0/24   # pinned so limiter pass_ip (gateway 172.18.0.1/32) stays valid
          gateway: 172.18.0.1
  valkey:
    internal: true     # no egress, no host access; SearXNG <-> Valkey only
